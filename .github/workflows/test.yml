name: Test API-Football
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Tester les resultats passes
        env:
          KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          api() { curl -s -H "x-apisports-key: $KEY" "https://v3.football.api-sports.io/$1"; }
          for D in 2026-08-16 2026-09-20 2026-10-11; do
            echo "=== Resultats du $D ==="
            api "fixtures?date=$D&timezone=Europe/Paris" | jq -c '{errors, total: .results, termines: ([.response[]? | select(.fixture.status.short=="FT")] | length), ligue2: ([.response[]? | select(.league.id==62 and .fixture.status.short=="FT")] | length), turquie: ([.response[]? | select(.league.id==203 and .fixture.status.short=="FT")] | length), exemple: ([.response[]? | select(.league.id==62)][0] | "\(.teams.home.name) \(.goals.home)-\(.goals.away) \(.teams.away.name)")}'
          done
